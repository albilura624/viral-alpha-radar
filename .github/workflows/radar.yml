name: Viral Alpha Radar
on:
  push:
    branches: [main]
    paths:
      - bot.py
      - requirements.txt
      - tests/**
      - .github/workflows/radar.yml
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: viral-alpha-radar
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Syntax and unit tests
        run: |
          python -m py_compile bot.py
          python -m unittest discover -s tests
  radar:
    # Scheduled scans are disabled until the owner deliberately enables them.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RADAR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Check code syntax
        run: python -m py_compile bot.py
      - name: Run filter unit tests
        run: python -m unittest discover -s tests
      - name: Scan news and memecoin markets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_ALERT_SCORE: '70'
        run: python bot.py
      - name: Save recent alert state for deduplication
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "Save alert state [skip ci]"
              git push
            fi
          fi
